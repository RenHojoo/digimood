name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 build-tools;36.0.0 platforms;android-36"

      - name: Ensure gradlew and wrapper jar are correct
        run: |
          # Always replace gradlew with the correct 8.14.3 version
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradlew" \
            -o android/gradlew
          chmod +x android/gradlew

          # Download wrapper jar if missing
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading from Gradle 8.14.3 release..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
              -o android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Fix Gradle config for AGP resolution
        run: |
          # Always overwrite settings.gradle with correct pluginManagement
          cat > android/settings.gradle << 'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          include ':app'
          include ':capacitor-cordova-android-plugins'
          project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

          apply from: 'capacitor.settings.gradle'
          GRADLE_SETTINGS

          # Always overwrite root build.gradle with plugins DSL
          cat > android/build.gradle << 'GRADLE_BUILD'
          // Top-level build file where you can add configuration options common to all sub-projects/modules.

          plugins {
              id 'com.android.application' version '8.13.0' apply false
              id 'com.android.library' version '8.13.0' apply false
          }

          apply from: "variables.gradle"

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE_BUILD

          # Always overwrite app/build.gradle with conditional signing fix
          cat > android/app/build.gradle << 'GRADLE_APP_BUILD'
          apply plugin: 'com.android.application'

          android {
              namespace = "com.digimood.app"
              compileSdk = rootProject.ext.compileSdkVersion
              buildToolsVersion = "36.0.0"
              defaultConfig {
                  applicationId "com.digimood.app"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode System.env.GITHUB_RUN_NUMBER ? System.env.GITHUB_RUN_NUMBER.toInteger() : 1
                  versionName System.env.GITHUB_REF_NAME ?: "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              applicationVariants.all { variant ->
                  variant.outputs.all {
                      outputFileName = "digimood.apk"
                  }
              }
              def keystorePath = System.env.ANDROID_KEYSTORE
              if (keystorePath != null && new File(keystorePath).exists()) {
                  signingConfigs {
                      release {
                          storeFile file(keystorePath)
                          storePassword System.env.ANDROID_KEYSTORE_PASSWORD ?: ''
                          keyAlias System.env.ANDROID_KEY_ALIAS ?: ''
                          keyPassword System.env.ANDROID_KEY_PASSWORD ?: ''
                      }
                  }
                  buildTypes {
                      release {
                          minifyEnabled false
                          proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                          signingConfig signingConfigs.release
                      }
                  }
              } else {
                  buildTypes {
                      release {
                          minifyEnabled false
                          proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      }
                  }
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:\$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:\$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:\$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:\$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:\$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:\$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }
          GRADLE_APP_BUILD

      - name: Build release APK
        working-directory: ./android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digimood-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          name: DigiMood ${{ github.ref_name }}
          generate_release_notes: true
