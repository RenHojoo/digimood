<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
    <title>DigiMood</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.png" />
    <meta name="theme-color" content="#1e1e1e" id="theme-color-meta" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mood-settings');
          if (raw) {
            var s = JSON.parse(raw);
            var base = s && s.customColors && s.customColors.base ? s.customColors.base : '#1e1e1e';
            document.documentElement.style.setProperty('--c-base', base);
            document.documentElement.style.backgroundColor = base;
            document.body && (document.body.style.backgroundColor = base);
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', base);
            var splash = document.getElementById('initial-splash');
            if (splash) splash.style.backgroundColor = base;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" style="width:100%;height:100%;height:100dvh;position:fixed;inset:0;box-sizing:border-box;"></div>
    <div id="initial-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:#1e1e1e;z-index:9999;transition:opacity .4s ease;box-sizing:border-box;padding-top:max(env(safe-area-inset-top),0px);padding-bottom:max(env(safe-area-inset-bottom),0px);">
      <img src="icon.png" width="250" height="250" alt="" style="display:block;" />
    </div>
    <script type="module" src="/src/app.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
